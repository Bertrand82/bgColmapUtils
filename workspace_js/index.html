<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Point cloud Cesium</title>
    <script type="module">
      import { Viewer, Cesium3DTileset } from "https://cdn.jsdelivr.net/npm/cesium@latest/+esm";

      const viewer = new Viewer("cesiumContainer", {
        animation: false,
        timeline: false,
        geocoder: false
      });

      const tileset = await Cesium3DTileset.fromUrl("http://localhost:8000/tileset.json");
      viewer.scene.primitives.add(tileset);
      await viewer.zoomTo(tileset);
    </script>
    <style>
      html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
  </body>
</html>
