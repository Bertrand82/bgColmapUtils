<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Viewer 3D Tiles local (tileset.json) - fond blanc</title>

  <!-- CesiumJS -->
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>

  <style>
    html, body { height: 100%; margin: 0; background: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #cesiumContainer { position: absolute; inset: 0; background: #fff; }
    #toolbar {
      position: absolute;
      z-index: 10;
      top: 10px; left: 10px;
      background: rgba(255,255,255,0.95);
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    #toolbar input[type="number"] { width: 120px; padding: 6px 8px; }
    #toolbar button { padding: 7px 10px; cursor: pointer; }
    #status { font-size: 12px; opacity: 0.85; max-width: 60vw; }
  </style>
</head>

<body>
  <div id="toolbar">
    <strong>tileset.json</strong>

    <label title="Pas de zoom (mètres / unités de la scène). Si c'est trop grand, mets 0.1 ou 0.01.">
      Zoom (pas)
      <input id="zoomStep" type="number" step="0.1" value="0.5" />
    </label>

    <button id="zoomIn">Zoom +</button>
    <button id="zoomOut">Zoom -</button>
    <button id="fit">Recentrer</button>

    <span id="status">Chargement…</span>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    const TILESET_URL = './tileset.json';

    const statusEl = document.getElementById('status');
    const zoomStepEl = document.getElementById('zoomStep');
    const zoomInBtn = document.getElementById('zoomIn');
    const zoomOutBtn = document.getElementById('zoomOut');
    const fitBtn = document.getElementById('fit');

    function setStatus(s) { statusEl.textContent = s; }

    const viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayer: false,
      terrainProvider: false,
      animation: false,
      timeline: false,
      geocoder: false,
      homeButton: false,
      navigationHelpButton: false,
      sceneModePicker: true,
      infoBox: false,
      selectionIndicator: false,
      shadows: false,
      shouldAnimate: false,
    });

    // Fond blanc + pas de ciel
    viewer.scene.backgroundColor = Cesium.Color.WHITE;
    viewer.scene.skyBox = undefined;
    viewer.scene.skyAtmosphere = undefined;
    viewer.scene.fog.enabled = false;

    // Tileset local => globe off
    viewer.scene.globe.show = false;
    viewer.scene.globe.depthTestAgainstTerrain = false;

    let tileset;

    async function load() {
      try {
        setStatus(`Chargement ${TILESET_URL} …`);

        tileset = await Cesium.Cesium3DTileset.fromUrl(TILESET_URL, {
          maximumScreenSpaceError: 8,
          dynamicScreenSpaceError: true,
        });

        viewer.scene.primitives.add(tileset);
        await tileset.readyPromise;

        if (tileset.pointCloudShading) {
          tileset.pointCloudShading.attenuation = true;
          tileset.pointCloudShading.maximumAttenuation = 8.0;
        }
        tileset.backFaceCulling = false;

        await fit();
        setStatus('OK (molette=zoom, clic droit=rotation, clic gauche=pan).');
      } catch (e) {
        console.error(e);
        setStatus(`Erreur: ${e?.message ?? String(e)}`);
      }
    }

    async function fit() {
      if (!tileset) return;
      await viewer.zoomTo(tileset);
    }

    function getZoomStep() {
      const v = Number(zoomStepEl.value);
      if (Number.isFinite(v) && v > 0) return v;

      // fallback: un pas relatif à la taille du tileset
      if (tileset?.boundingSphere?.radius) return tileset.boundingSphere.radius * 0.1;
      return 1.0;
    }

    // IMPORTANT: on utilise les API Cesium identiques à la molette
    zoomInBtn.addEventListener('click', () => {
      viewer.camera.zoomIn(getZoomStep());
    });

    zoomOutBtn.addEventListener('click', () => {
      viewer.camera.zoomOut(getZoomStep());
    });

    fitBtn.addEventListener('click', fit);

    load();
  </script>
</body>
</html>
